# Builds ghcr.io/kicadaiplayground/kicad-mcp:<kicad tag>-mcp<kicad-mcp-pro version> on push to main or by hand.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        run: |
          kicad=$(grep -oP '^ARG KICAD_IMAGE=.*:\K.*' Dockerfile)
          mcp=$(grep -oP '^ARG KICAD_MCP_PRO_VERSION=\K.*' Dockerfile)
          echo "tag=${kicad}-mcp${mcp}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kicadaiplayground/kicad-mcp:${{ steps.v.outputs.tag }}
